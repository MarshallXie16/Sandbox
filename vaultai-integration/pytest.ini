[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
filterwarnings =
    ignore::DeprecationWarning
markers =
    asyncio: mark test as async
    unit: unit tests
    integration: integration tests
    slow: slow running tests
