[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO

# Coverage options (when using --cov)
addopts =
    --strict-markers
    --tb=short
    -ra

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that take more than 1 second
